<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --panel: #111;
    --text: #fff;
    --green: #00b894;
    --red: #d63031;
    --accent: #222;
  }

  * { box-sizing: border-box; font-family: "Poppins", sans-serif; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: #000;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 1.4rem;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    border-bottom-left-radius: 25px;
    border-bottom-right-radius: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  #topButtons {
    position: fixed;
    top: 14px;
    right: 18px;
    display: flex;
    gap: 10px;
    z-index: 1100;
  }

  .top-btn {
    font-size: 1.2rem;
    background: var(--accent);
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
  }

  .top-btn:hover { background: #333; }

  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100%;
    background: #000;
    transform: translateX(-270px);
    transition: all 0.3s ease;
    padding: 20px;
    border-top-right-radius: 25px;
    border-bottom-right-radius: 25px;
    box-shadow: 3px 0 10px rgba(0,0,0,0.6);
    z-index: 1001;
  }

  #sidebar.open { transform: translateX(0); }

  .menu-item {
    padding: 14px 18px;
    margin-bottom: 10px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
  }

  .menu-item:hover { background: #222; }

  main {
    margin-top: 100px;
    padding: 16px;
  }

  .form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  input, button, select {
    padding: 14px;
    border-radius: 20px;
    border: none;
    font-size: 1rem;
    outline: none;
  }

  input, select { background: #222; color: white; }
  input::placeholder { color: #aaa; }

  button {
    background: #000;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover { background: #222; }

  .card {
    background: var(--panel);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .info { font-size: 0.9rem; flex: 1 1 180px; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .status-btn, .delete-btn {
    border-radius: 18px;
    padding: 10px 16px;
    font-weight: 600;
    border: 1px solid #333;
    background: #000;
    cursor: pointer;
    flex: 1 1 100px;
    text-align: center;
  }

  .status-btn.pago { color: var(--green); }
  .status-btn.nao { color: var(--red); }
  .status-btn:hover, .delete-btn:hover { background: #111; }

  .totals {
    text-align: center;
    font-weight: 600;
    margin-top: 15px;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 14px;
  }

  #mesFiltroContainer {
    text-align: center;
    margin-bottom: 20px;
  }

  #mesFiltro {
    background: #222;
    border-radius: 18px;
    padding: 10px;
    color: white;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .form { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<header>Painel de Vendas</header>

<div id="topButtons">
  <button id="hamburgerBtn" class="top-btn">&#9776;</button>
  <button id="syncBtn" class="top-btn" title="Sincronizar">&#x21bb;</button>
</div>

<aside id="sidebar">
  <div class="menu-item" onclick="carregarVendas()">Todas</div>
  <div class="menu-item" onclick="filtrar(true)">Pagas</div>
  <div class="menu-item" onclick="filtrar(false)">Não Pagas</div>
</aside>

<main>
  <section class="form">
    <input id="cliente" placeholder="Nome do cliente">
    <input id="valor" type="number" step="0.01" placeholder="Valor (R$)">
    <input id="quantidade" type="number" min="1" value="1" placeholder="Qtd">
    <input id="dataVenda" type="date">
    <button onclick="adicionarVenda()">Adicionar</button>
  </section>

  <div id="mesFiltroContainer">
    <select id="mesFiltro" onchange="filtrarMes()"></select>
  </div>

  <div id="listaVendas"></div>
  <div class="totals" id="totais">Total Pago: R$ 0,00 | Total Não Pago: R$ 0,00</div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwbGpkzdk-uowBk1Mg3LKUnJZ8vk1yuj7HYZZk_tUUw6Vo8gpCQMx3g_TUzuNkvTyjM/exec";

const sidebar = document.getElementById('sidebar');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const syncBtn = document.getElementById('syncBtn');
const dataVenda = document.getElementById('dataVenda');
const mesFiltro = document.getElementById('mesFiltro');

hamburgerBtn.addEventListener('click', e => { e.stopPropagation(); sidebar.classList.toggle('open'); });
document.addEventListener('click', e => { if(!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) sidebar.classList.remove('open'); });
syncBtn.addEventListener('click', carregarVendas);

dataVenda.value = new Date().toISOString().split('T')[0];

let todasVendas = [];

async function fetchAPI(params = {}, method = "GET") {
  const url = method === "GET" ? API_URL + "?" + new URLSearchParams(params) : API_URL;
  const options = method === "POST" ? { method: "POST", body: JSON.stringify(params) } : {};
  const res = await fetch(url, options);
  return await res.json();
}

async function carregarVendas() {
  try {
    const vendas = await fetchAPI({ action: "get" });
    todasVendas = vendas.sort((a, b) => a.cliente.localeCompare(b.cliente));
    preencherFiltroMes();
    filtrarMes();
  } catch (e) {
    alert("Erro ao carregar dados. Verifique sua conexão e tente novamente.");
  }
}

function preencherFiltroMes() {
  const meses = [...new Set(todasVendas.map(v => v.dataVenda.slice(0, 7)))];
  mesFiltro.innerHTML = meses.map(m => {
    const [ano, mes] = m.split("-");
    return `<option value="${m}">${mesNome(mes)}/${ano}</option>`;
  }).join("");
}

function mesNome(m) {
  const nomes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return nomes[parseInt(m)-1];
}

function filtrarMes() {
  const mesSelecionado = mesFiltro.value;
  const vendasFiltradas = todasVendas.filter(v => v.dataVenda.startsWith(mesSelecionado));
  exibirVendas(vendasFiltradas);
}

function exibirVendas(vendas) {
  const lista = document.getElementById('listaVendas');
  lista.innerHTML = "";
  let totalPago = 0, totalNao = 0;

  vendas.forEach(v => {
    const valor = parseFloat(v.valor) || 0;
    const quantidade = parseInt(v.quantidade) || 1;

    const card = document.createElement('div');
    card.className = "card";

    const info = document.createElement('div');
    info.className = "info";
    info.innerHTML = `<strong>${v.cliente}</strong><br>
                      Valor: R$ ${valor.toFixed(2)}<br>
                      Qtd: ${quantidade} | Total: R$ ${(valor * quantidade).toFixed(2)}<br>
                      Data: ${v.dataVenda}`;

    const actions = document.createElement('div');
    actions.className = "actions";

    const statusBtn = document.createElement('button');
    statusBtn.className = "status-btn " + (v.pago ? "pago" : "nao");
    statusBtn.textContent = v.pago ? "PAGO" : "NÃO PAGO";
    statusBtn.onclick = () => togglePago(v.id, !v.pago);

    const delBtn = document.createElement('button');
    delBtn.className = "delete-btn";
    delBtn.textContent = "EXCLUIR";
    delBtn.onclick = () => excluirVenda(v.id);

    actions.appendChild(statusBtn);
    actions.appendChild(delBtn);

    card.appendChild(info);
    card.appendChild(actions);
    lista.appendChild(card);

    if(v.pago) totalPago += valor * quantidade;
    else totalNao += valor * quantidade;
  });

  document.getElementById('totais').textContent = `Total Pago: R$ ${totalPago.toFixed(2)} | Total Não Pago: R$ ${totalNao.toFixed(2)}`;
}

async function adicionarVenda() {
  const cliente = document.getElementById('cliente').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const quantidade = parseInt(document.getElementById('quantidade').value) || 1;
  const data = document.getElementById('dataVenda').value;

  if(!cliente || isNaN(valor)) return alert("Preencha os campos corretamente!");

  const existente = todasVendas.find(v => v.cliente.toLowerCase() === cliente.toLowerCase());
  if (existente) {
    await fetchAPI({ action: "updateQuantidade", id: existente.id, valor: existente.valor + valor, quantidade: existente.quantidade + quantidade }, "POST");
  } else {
    await fetchAPI({ action: "add", cliente, valor, quantidade, dataVenda: data }, "POST");
  }

  carregarVendas();
}

async function togglePago(id, novoStatus) {
  await fetchAPI({ action: "updateStatus", id, pago: novoStatus }, "POST");
  carregarVendas();
}

async function excluirVenda(id) {
  if(!confirm("Deseja realmente excluir esta venda?")) return;
  await fetchAPI({ action: "delete", id }, "POST");
  carregarVendas();
}

function filtrar(pagoStatus) {
  const cards = document.querySelectorAll(".card");
  cards.forEach(card => {
    const statusBtn = card.querySelector(".status-btn");
    if(statusBtn.textContent === "PAGO") card.style.display = pagoStatus ? "flex" : "none";
    else card.style.display = pagoStatus === false ? "flex" : "none";
  });
}

carregarVendas();
</script>
</body>
</html>
