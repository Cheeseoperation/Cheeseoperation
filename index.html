<script>
const API_URL = "https://script.google.com/macros/s/AKfycby71d8X-MT1IpMwTGhiWqsUUAwfa6bQRSh01y4RsqTDuFbkfdYb2_3fmLc-VL3NsgMD/exec";
let vendas = [];
let filtroMes = null;
let filtroStatus = null;
let editandoId = null;

// === Carregar vendas do Sheets (com filtro de duplicatas) ===
async function carregarVendas() {
  try {
    const res = await fetch(API_URL);
    const dados = await res.json();

    // Remover duplicações com base no ID
    const mapa = new Map();
    vendas = dados.filter(v => {
      if (!v.id) return false; // ignora linhas sem ID
      if (mapa.has(v.id)) return false;
      mapa.set(v.id, true);
      return true;
    });

    gerarBotoesMeses();
    atualizarListaLocal();
  } catch (err) {
    alert("Erro ao carregar vendas: " + err);
  }
}

// === Adicionar nova venda ===
function adicionarVenda() {
  const cliente = document.getElementById("cliente").value.trim();
  const valor = parseFloat(document.getElementById("valor").value);
  const dataVenda = document.getElementById("dataVenda").value;
  if (!cliente || isNaN(valor) || !dataVenda) {
    alert("Preencha todos os campos!");
    return;
  }

  const id = Date.now();
  const venda = { cliente, valor, dataVenda, pago: false, id };

  // Verifica se já existe um registro com mesmo ID (ou cliente + data)
  const duplicada = vendas.some(v => v.cliente === cliente && v.dataVenda === dataVenda && v.valor === valor);
  if (duplicada) {
    alert("Essa venda já foi registrada!");
    return;
  }

  vendas.push(venda);
  gerarBotoesMeses();
  atualizarListaLocal();

  document.getElementById("cliente").value = "";
  document.getElementById("valor").value = "";
  document.getElementById("dataVenda").value = "";

  fetch(API_URL, { method: "POST", body: JSON.stringify(venda) })
    .catch(err => console.log("Erro ao adicionar venda:", err));
}

// === Alternar status Pago / Não Pago ===
function togglePago(id) {
  const v = vendas.find(v => v.id === id);
  if (v) {
    v.pago = !v.pago;
    atualizarListaLocal();
    fetch(API_URL, { method: "POST", body: JSON.stringify(v) })
      .catch(err => console.log("Erro ao atualizar venda:", err));
  }
}

// === Excluir venda ===
function excluirVenda(id) {
  vendas = vendas.filter(v => v.id !== id);
  gerarBotoesMeses();
  atualizarListaLocal();
  fetch(API_URL, { method: "POST", body: JSON.stringify({ acao: "excluir", id }) })
    .catch(err => console.log("Erro ao excluir:", err));
}

// === Editar venda ===
function editarVenda(id) {
  const v = vendas.find(v => v.id === id);
  if (v) {
    editandoId = id;
    document.getElementById("editCliente").value = v.cliente;
    document.getElementById("editValor").value = v.valor;
    document.getElementById("editData").value = v.dataVenda;
    document.getElementById("modalEditar").style.display = "flex";
  }
}

// === Salvar edição ===
function salvarEdicao() {
  const cliente = document.getElementById("editCliente").value.trim();
  const valor = parseFloat(document.getElementById("editValor").value);
  const dataVenda = document.getElementById("editData").value;
  if (!cliente || isNaN(valor) || !dataVenda) {
    alert("Preencha todos os campos!");
    return;
  }

  const v = vendas.find(v => v.id === editandoId);
  if (v) {
    v.cliente = cliente;
    v.valor = valor;
    v.dataVenda = dataVenda;
    atualizarListaLocal();
    fetch(API_URL, { method: "POST", body: JSON.stringify(v) })
      .catch(err => console.log("Erro ao atualizar venda:", err));
  }
  fecharModal();
}

// === Fechar modal ===
function fecharModal() {
  document.getElementById("modalEditar").style.display = "none";
  editandoId = null;
}

// === Gerar botões de meses ===
function gerarBotoesMeses() {
  const div = document.getElementById("mesesMenu");
  div.innerHTML = "<h3>Meses</h3>";
  const meses = [...new Set(vendas.map(v => {
    const d = new Date(v.dataVenda);
    return `${d.getFullYear()}-${d.getMonth() + 1}`;
  }))];
  meses.sort((a, b) => new Date(a + "-01") - new Date(b + "-01"));
  const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  meses.forEach(m => {
    const [ano, mes] = m.split("-");
    const btn = document.createElement("button");
    btn.textContent = `${nomesMeses[mes - 1]} ${ano}`;
    btn.onclick = () => { filtroMes = m; atualizarListaLocal(); };
    div.appendChild(btn);
  });
}

// === Atualizar lista local ===
function atualizarListaLocal() {
  const div = document.getElementById("listaVendas");
  div.innerHTML = "";
  let lista = [...vendas];
  if (filtroMes) lista = lista.filter(v => {
    const d = new Date(v.dataVenda);
    return `${d.getFullYear()}-${d.getMonth() + 1}` === filtroMes;
  });
  if (filtroStatus === "pago") lista = lista.filter(v => v.pago);
  if (filtroStatus === "nao") lista = lista.filter(v => !v.pago);
  lista.sort((a, b) => a.cliente.localeCompare(b.cliente));

  let totalPagos = 0, totalNaoPagos = 0;
  lista.forEach(v => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div><strong>${v.cliente}</strong> - R$ ${v.valor.toFixed(2)}<br><small>${new Date(v.dataVenda).toLocaleDateString()}</small></div>
      <div style="text-align:right;">
        <span class="${v.pago ? 'pago' : 'nao-pago'}">${v.pago ? 'Pago' : 'Não Pago'}</span><br>
        <button onclick="togglePago(${v.id})"><i class="fa-solid fa-check"></i></button>
        <button onclick="editarVenda(${v.id})"><i class="fa-solid fa-pen"></i></button>
        <button onclick="excluirVenda(${v.id})"><i class="fa-solid fa-trash"></i></button>
      </div>`;
    div.appendChild(card);
    if (v.pago) totalPagos += v.valor; else totalNaoPagos += v.valor;
  });
  document.getElementById("totais").innerHTML =
    `Total Pago: R$ ${totalPagos.toFixed(2)} | Total Não Pago: R$ ${totalNaoPagos.toFixed(2)}`;
}

// === Toggle menu lateral ===
function toggleMenu() {
  document.getElementById("menu").classList.toggle("hidden");
  document.getElementById("conteudo").classList.toggle("full");
}

// === Inicialização ===
carregarVendas();
</script>
