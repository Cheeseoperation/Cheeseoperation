<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Painel de Vendas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --primary:#8B0000; /* vermelho vinho */
    --bg:#ffffff;
    --muted:#f4f4f6;
    --success:#00b894;
    --danger:#d63031;
    --card-radius:12px;
  }
  *{box-sizing:border-box}
  body{font-family:Inter, "Poppins",sans-serif;margin:0;background:var(--muted);color:#222;min-height:100vh;display:flex;align-items:stretch}
  .app{width:100%;max-width:1100px;margin:28px auto;background:var(--bg);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,0.08);overflow:hidden;display:grid;grid-template-columns:260px 1fr; transition: all 0.3s ease;}
  /* Sidebar */
  .sidebar{background:var(--primary);color:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;transition: transform 0.3s ease;}
  .brand{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
  .brand i{background:#fff;color:var(--primary);padding:8px;border-radius:8px}
  .side-controls{margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .side-controls button{background:#fff;border:none;color:var(--primary);padding:10px;border-radius:10px;font-weight:600;cursor:pointer;text-align:left}
  .side-controls button:hover{opacity:.95;transform:translateY(-2px)}
  .months{margin-top:8px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:40vh;padding-right:6px}
  /* Main */
  .main{padding:22px;display:flex;flex-direction:column;gap:16px}
  header.app-header{display:flex;justify-content:space-between;align-items:center}
  .title{font-size:1.25rem;font-weight:700;color:var(--primary)}
  .controls{display:flex;gap:12px;align-items:center}
  .input-row{display:flex;gap:10px;flex-wrap:wrap}
  input, button{padding:10px 12px;border-radius:10px;border:1px solid #e6e6e9;font-size:0.95rem}
  input[type="date"]{padding:9px 10px}
  .btn-primary{background:var(--primary);color:#fff;border:none;cursor:pointer;font-weight:700}
  .btn-ghost{background:transparent;border:1px solid #ddd}
  /* list */
  .list{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding-right:6px}
  .card{background:#fff;border-radius:var(--card-radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,0.04)}
  .card-left{display:flex;flex-direction:column;gap:6px}
  .client{font-weight:700}
  .meta{font-size:0.85rem;color:#666}
  .card-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .status{font-weight:700;padding:6px 8px;border-radius:8px;font-size:0.85rem}
  .status.pago{color:var(--success)}
  .status.nao{color:var(--danger)}
  .actions{display:flex;gap:8px}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:8px;border-radius:8px}
  .totals{margin-top:6px;background:var(--primary);color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:700}
  /* toast + loader */
  .toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
  .toast{background:#111;color:#fff;padding:10px 14px;border-radius:10px;opacity:0.95}
  .loader{width:42px;height:42px;border-radius:50%;border:4px solid rgba(0,0,0,0.06);border-top-color:var(--primary);animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Hamburger menu button */
  .hamburger {
    display: none;
    font-size: 1.8rem;
    color: var(--primary);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 10px;
  }

  /* responsive */
  @media (max-width:900px){
    .app{grid-template-columns:1fr; margin:12px}
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 260px;
      padding: 20px;
      transform: translateX(-100%);
      z-index: 1000;
    }
    .sidebar.active {
      transform: translateX(0);
      box-shadow: 4px 0 12px rgba(0,0,0,0.1);
    }
    .months{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:50vh;padding-right:6px;}
    .list{max-height:40vh}
    .hamburger { display: block; }
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Painel de Vendas">
    <aside class="sidebar" id="sidebar" aria-label="Filtros">
      <div class="brand"><i class="fa-solid fa-cheese"></i> Painel</div>
      <div style="font-weight:600">Vendas</div>
      <div class="side-controls">
        <button onclick="setFiltro(null,null)">Todas</button>
        <button onclick="setFiltro('pago',null)">Pagas</button>
        <button onclick="setFiltro('nao',null)">Não Pagas</button>
      </div>
      <div style="margin-top:8px;font-weight:600">Meses</div>
      <div class="months" id="mesesMenu"></div>
    </aside>

    <main class="main">
      <header class="app-header">
        <button class="hamburger" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" id="hamburgerBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="title">Painel de Vendas</div>
        <div class="controls">
          <div id="loading" style="display:none" title="Carregando..."><span class="loader"></span></div>
        </div>
      </header>

      <section class="form">
        <div class="input-row">
          <input id="cliente" placeholder="Nome do cliente" autocomplete="off">
          <input id="valor" type="number" placeholder="Valor (R$)" min="0" step="0.01">
          <input id="dataVenda" type="date">
          <button class="btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i>&nbsp;Adicionar</button>
        </div>
      </section>

      <section>
        <div class="list" id="listaVendas" aria-live="polite"></div>
        <div class="totals" id="totais">Total Pago: R$ 0,00 | Total Não Pago: R$ 0,00</div>
      </section>
    </main>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
/* ====== CONFIG ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbycXqhk6YtdwZQOfbnx8OqnAwy8o9AkQYoZTXs24VZaAdaIZ-ELC77lPlHkKNOS1in3/exec";
let vendas = [];
let filtroMes = null;
let filtroStatus = null;

/* ====== UTIL ====== */
function showToast(msg, short=true){
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=> { t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, short?2200:4200);
}

function setLoading(on){
  document.getElementById('loading').style.display = on ? 'inline-block' : 'none';
}

/* safe fetch with timeout */
async function fetchWithTimeout(url, opts = {}, timeout = 10000){
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), timeout);
  try {
    const res = await fetch(url, {...opts, signal: controller.signal});
    clearTimeout(id);
    return res;
  } catch(e){
    clearTimeout(id);
    throw e;
  }
}

/* format helpers */
function formatCurrency(n){ return Number(n||0).toFixed(2).replace('.',','); }
function formatDate(iso){ try { return new Date(iso).toLocaleDateString(); } catch(e){ return iso; } }

/* ====== CRUD FRONT ====== */
async function carregarVendas(){
  setLoading(true);
  try {
    const res = await fetchWithTimeout(API_URL, {cache:'no-store'}, 12000);
    if(!res.ok) throw new Error('Resposta não OK: '+res.status);
    const data = await res.json();

    // Normaliza: garante IDs e tipos corretos, remove duplicatas por ID
    const map = new Map();
    vendas = data.reduce((acc,row)=>{
      const id = String(row.id || row.ID || row.Id || '').trim();
      if(!id) return acc;
      if(map.has(id)) return acc;
      map.set(id,true);
      acc.push({
        id,
        cliente: row.cliente || row.Cliente || '',
        valor: Number(row.valor || row.Valor || 0),
        dataVenda: row.dataVenda || row.DataVenda || '',
        pago: (row.pago === true || row.pago === 'true' || row.pago === 'TRUE')
      });
      return acc;
    }, []);

    gerarBotoesMeses();
    atualizarLista();
  } catch(err){
    console.error('Erro carregarVendas',err);
    showToast('Erro ao carregar vendas. Verifique conexão.', false);
  } finally {
    setLoading(false);
  }
}

/* Add: envia ao servidor, espera id gerado e só então adiciona local */
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const cliente = document.getElementById('cliente').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const dataVenda = document.getElementById('dataVenda').value;
  if(!cliente || isNaN(valor) || !dataVenda){
    showToast('Preencha todos os campos corretamente.');
    return;
  }
  setLoading(true);
  try {
    const payload = { cliente, valor, dataVenda, pago: false };
    const res = await fetchWithTimeout(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }, 15000);
    if(!res.ok) throw new Error('Erro ao adicionar venda');
    const json = await res.json();
    // Supondo que o servidor retorna o id gerado
    if(json.id){
      vendas.push({id: json.id, cliente, valor, dataVenda, pago: false});
      gerarBotoesMeses();
      atualizarLista();
      document.getElementById('cliente').value = '';
      document.getElementById('valor').value = '';
      document.getElementById('dataVenda').value = '';
      showToast('Venda adicionada com sucesso!');
    } else {
      throw new Error('Resposta inesperada');
    }
  } catch(e){
    showToast('Falha ao adicionar venda.', false);
    console.error(e);
  } finally {
    setLoading(false);
  }
});

/* Remove venda local e via API */
async function removerVenda(id){
  if(!confirm('Confirma exclusão dessa venda?')) return;
  setLoading(true);
  try {
    const res = await fetchWithTimeout(API_URL + '?id=' + encodeURIComponent(id), {method:'DELETE'}, 10000);
    if(!res.ok) throw new Error('Erro ao excluir venda');
    vendas = vendas.filter(v=>v.id !== id);
    gerarBotoesMeses();
    atualizarLista();
    showToast('Venda removida.');
  } catch(e){
    showToast('Erro ao remover venda.', false);
    console.error(e);
  } finally {
    setLoading(false);
  }
}

/* Atualiza a lista exibida de vendas conforme filtros */
function atualizarLista(){
  const lista = document.getElementById('listaVendas');
  lista.innerHTML = '';

  // Filtra por status e mes
  let filtradas = vendas;
  if(filtroStatus === 'pago'){
    filtradas = filtradas.filter(v=>v.pago === true);
  } else if(filtroStatus === 'nao'){
    filtradas = filtradas.filter(v=>v.pago === false);
  }

  if(filtroMes){
    filtradas = filtradas.filter(v=>{
      const d = new Date(v.dataVenda);
      if(isNaN(d)) return false;
      const key = `${d.getFullYear()}-${d.getMonth() + 1}`;
      return key === filtroMes;
    });
  }

  if(filtradas.length === 0){
    lista.innerHTML = '<p>Nenhuma venda encontrada.</p>';
  }

  let totalPago = 0;
  let totalNao = 0;
  filtradas.forEach(v=>{
    totalPago += v.pago ? v.valor : 0;
    totalNao += v.pago ? 0 : v.valor;

    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('tabindex','0');

    const left = document.createElement('div');
    left.className = 'card-left';
    left.innerHTML = `<div class="client">${v.cliente}</div><div class="meta">${formatDate(v.dataVenda)}</div>`;

    const right = document.createElement('div');
    right.className = 'card-right';
    const statusText = v.pago ? 'Pago' : 'Não Pago';
    const statusClass = v.pago ? 'pago' : 'nao';
    right.innerHTML = `<div class="status ${statusClass}">${statusText}</div><div>R$ ${formatCurrency(v.valor)}</div>`;

    const actions = document.createElement('div');
    actions.className = 'actions';

    // Botão remover
    const btnRemove = document.createElement('button');
    btnRemove.className = 'icon-btn';
    btnRemove.title = 'Remover venda';
    btnRemove.setAttribute('aria-label', `Remover venda de ${v.cliente} no valor R$${formatCurrency(v.valor)}`);
    btnRemove.innerHTML = '<i class="fa-solid fa-trash"></i>';
    btnRemove.onclick = () => removerVenda(v.id);

    actions.appendChild(btnRemove);

    right.appendChild(actions);

    card.appendChild(left);
    card.appendChild(right);

    lista.appendChild(card);
  });

  // Atualiza totais
  document.getElementById('totais').textContent = `Total Pago: R$ ${formatCurrency(totalPago)} | Total Não Pago: R$ ${formatCurrency(totalNao)}`;
}

/* Define filtro e atualiza lista */
function setFiltro(status, mes){
  filtroStatus = status;
  filtroMes = mes;
  atualizarLista();
}

/* Gera botões dos meses disponíveis nas vendas */
function gerarBotoesMeses(){
  const div = document.getElementById('mesesMenu'); 
  div.innerHTML = '';

  const setMes = new Set();

  vendas.forEach(v => {
    try {
      const d = new Date(v.dataVenda);
      if (!isNaN(d)) {
        const mesAno = `${d.getFullYear()}-${d.getMonth() + 1}`; 
        setMes.add(mesAno);
      }
    } catch(e) {}
  });

  const meses = Array.from(setMes).sort((a, b) => {
    const [anoA, mesA] = a.split('-').map(Number);
    const [anoB, mesB] = b.split('-').map(Number);
    return new Date(anoA, mesA - 1) - new Date(anoB, mesB - 1);
  });

  const nomes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  meses.forEach(m => {
    const [ano, mes] = m.split('-');
    const btn = document.createElement('button');
    btn.textContent = `${nomes[Number(mes) - 1]} ${ano}`;
    btn.style.border = 'none';
    btn.style.padding = '8px';
    btn.style.borderRadius = '8px';
    btn.style.cursor = 'pointer';
    btn.onclick = () => { setFiltro(null, m); };
    div.appendChild(btn);
  });
}

/* Hamburger toggle */
const hamburgerBtn = document.getElementById('hamburgerBtn');
const sidebar = document.getElementById('sidebar');
hamburgerBtn.addEventListener('click', () => {
  const expanded = hamburgerBtn.getAttribute('aria-expanded') === 'true' || false;
  hamburgerBtn.setAttribute('aria-expanded', !expanded);
  sidebar.classList.toggle('active');
});

/* Inicializa carregamento */
window.onload = () => {
  carregarVendas();
};
</script>

</body>
</html>
