<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --text: #fff;
    --green: #00b894;
    --red: #d63031;
    --accent: #1e1e1e;
  }

  * { box-sizing: border-box; font-family: "Poppins", sans-serif; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: #000;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 1.4rem;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    border-bottom-left-radius: 25px;
    border-bottom-right-radius: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  #hamburgerBtn {
    position: fixed;
    top: 18px;
    left: 18px;
    font-size: 1.8rem;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    z-index: 1100;
  }

  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100%;
    background: #000;
    transform: translateX(-270px);
    transition: all 0.3s ease;
    padding: 20px;
    border-top-right-radius: 25px;
    border-bottom-right-radius: 25px;
    box-shadow: 3px 0 10px rgba(0,0,0,0.6);
    z-index: 1001;
  }
  #sidebar.open { transform: translateX(0); }

  .menu-item {
    padding: 14px 18px;
    margin-bottom: 10px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
  }
  .menu-item:hover { background: #1f1f1f; }

  main {
    margin-top: 100px;
    padding: 16px;
  }

  .form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  input, button {
    padding: 14px;
    border-radius: 20px;
    border: none;
    font-size: 1rem;
    outline: none;
  }
  input { background: #1c1c1c; color: white; }
  input::placeholder { color: #aaa; }

  button {
    background: #181818;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid #333;
  }
  button:hover { background: #222; }

  .card {
    background: var(--panel);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }
  .card:hover { transform: scale(1.01); }

  .info { font-size: 0.9rem; flex: 1 1 180px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .status-btn, .delete-btn {
    border-radius: 18px;
    padding: 10px 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    flex: 1 1 100px;
    text-align: center;
    transition: 0.3s;
  }
  .status-btn.pago { background: rgba(0,184,148,0.1); color: var(--green); border: 1px solid var(--green); }
  .status-btn.nao { background: rgba(214,48,49,0.1); color: var(--red); border: 1px solid var(--red); }
  .delete-btn { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid #444; }
  .delete-btn:hover { background: #222; }

  .totals {
    text-align: center;
    font-weight: 600;
    margin-top: 15px;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 14px;
  }

  .loader {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 0.95rem;
  }

  @media (max-width: 480px) {
    .form { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<header>Painel de Vendas</header>
<button id="hamburgerBtn">&#9776;</button>

<aside id="sidebar">
  <div class="menu-item" onclick="carregarVendas()">Todas</div>
  <div class="menu-item" onclick="filtrar(true)">Pagas</div>
  <div class="menu-item" onclick="filtrar(false)">Não Pagas</div>
</aside>

<main>
  <section class="form">
    <input id="cliente" placeholder="Nome do cliente">
    <input id="valor" type="number" step="0.01" placeholder="Valor (R$)">
    <input id="quantidade" type="number" min="1" value="1" placeholder="Qtd">
    <input id="dataVenda" type="date">
    <button onclick="adicionarVenda()">Adicionar</button>
  </section>

  <div id="listaVendas"></div>
  <div class="totals" id="totais">Total Pago: R$ 0,00 | Total Não Pago: R$ 0,00</div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwbGpkzdk-uowBk1Mg3LKUnJZ8vk1yuj7HYZZk_tUUw6Vo8gpCQMx3g_TUzuNkvTyjM/exec";

const sidebar = document.getElementById('sidebar');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const dataVenda = document.getElementById('dataVenda');
const lista = document.getElementById('listaVendas');

hamburgerBtn.addEventListener('click', e => { e.stopPropagation(); sidebar.classList.toggle('open'); });
document.addEventListener('click', e => { if(!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) sidebar.classList.remove('open'); });

dataVenda.value = new Date().toISOString().split('T')[0];

async function fetchAPI(params = {}, method = "GET", timeout = 8000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  const url = method === "GET" ? API_URL + "?" + new URLSearchParams(params) : API_URL;
  const options = method === "POST"
    ? { method: "POST", body: JSON.stringify(params), signal: controller.signal }
    : { signal: controller.signal };

  try {
    const res = await fetch(url, options);
    clearTimeout(timer);
    if (!res.ok) throw new Error("Erro na requisição");
    return await res.json();
  } catch (err) {
    console.error(err);
    alert("Erro ao carregar dados. Verifique sua conexão ou tente novamente.");
    return [];
  }
}

async function carregarVendas() {
  lista.innerHTML = `<div class="loader">Carregando dados...</div>`;
  const vendas = await fetchAPI({ action: "get" });
  exibirVendas(vendas);
}

function exibirVendas(vendas = []) {
  lista.innerHTML = "";
  if (!vendas.length) {
    lista.innerHTML = `<div class="loader">Nenhuma venda encontrada.</div>`;
    return;
  }

  let totalPago = 0, totalNao = 0;

  vendas.forEach(v => {
    const card = document.createElement('div');
    card.className = "card";

    const info = document.createElement('div');
    info.className = "info";
    info.innerHTML = `<strong>${v.cliente}</strong><br>
                      Valor: R$ ${v.valor.toFixed(2)}<br>
                      Qtd: ${v.quantidade} | Total: R$ ${(v.valor * v.quantidade).toFixed(2)}<br>
                      Data: ${v.dataVenda}`;

    const actions = document.createElement('div');
    actions.className = "actions";

    const statusBtn = document.createElement('button');
    statusBtn.className = "status-btn " + (v.pago ? "pago" : "nao");
    statusBtn.textContent = v.pago ? "PAGO" : "NÃO PAGO";
    statusBtn.onclick = () => togglePago(v.id, !v.pago);

    const delBtn = document.createElement('button');
    delBtn.className = "delete-btn";
    delBtn.textContent = "EXCLUIR";
    delBtn.onclick = () => excluirVenda(v.id);

    actions.appendChild(statusBtn);
    actions.appendChild(delBtn);

    card.appendChild(info);
    card.appendChild(actions);
    lista.appendChild(card);

    if(v.pago) totalPago += v.valor * v.quantidade;
    else totalNao += v.valor * v.quantidade;
  });

  document.getElementById('totais').textContent = 
    `Total Pago: R$ ${totalPago.toFixed(2)} | Total Não Pago: R$ ${totalNao.toFixed(2)}`;
}

async function adicionarVenda() {
  const cliente = document.getElementById('cliente').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const quantidade = parseInt(document.getElementById('quantidade').value) || 1;
  const data = document.getElementById('dataVenda').value;

  if(!cliente || isNaN(valor)) return alert("Preencha os campos corretamente!");

  lista.innerHTML = `<div class="loader">Adicionando venda...</div>`;
  await fetchAPI({ action: "add", cliente, valor, quantidade, dataVenda: data }, "POST");
  carregarVendas();
}

async function togglePago(id, novoStatus) {
  lista.innerHTML = `<div class="loader">Atualizando status...</div>`;
  await fetchAPI({ action: "updateStatus", id, pago: novoStatus }, "POST");
  carregarVendas();
}

async function excluirVenda(id) {
  if(!confirm("Deseja realmente excluir esta venda?")) return;
  lista.innerHTML = `<div class="loader">Excluindo venda...</div>`;
  await fetchAPI({ action: "delete", id }, "POST");
  carregarVendas();
}

async function filtrar(pagoStatus) {
  const vendas = await fetchAPI({ action: "get" });
  const filtradas = vendas.filter(v => v.pago === pagoStatus);
  exibirVendas(filtradas);
}

carregarVendas();
</script>
</body>
</html>
