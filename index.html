<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#111;--text:#fff;--green:#00b894;--red:#d63031;}
*{box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);}
header{background:#000;color:white;text-align:center;padding:18px;font-size:1.4rem;position:fixed;top:0;width:100%;z-index:1000;border-bottom-left-radius:25px;border-bottom-right-radius:25px;box-shadow:0 2px 8px rgba(0,0,0,.5);}
#topButtons{position:fixed;top:18px;right:18px;display:flex;gap:10px;z-index:1100;}
.top-btn{background:#111;color:white;border:none;font-size:1.2rem;padding:10px 14px;border-radius:50%;cursor:pointer;transition:.3s;}
.top-btn:hover{background:#222;}
#sidebar{position:fixed;top:0;left:0;width:260px;height:100%;background:#000;transform:translateX(-270px);transition:all .3s ease;padding:20px;border-top-right-radius:25px;border-bottom-right-radius:25px;box-shadow:3px 0 10px rgba(0,0,0,.6);z-index:1001;}
#sidebar.open{transform:translateX(0);}
.menu-item{padding:14px 18px;margin-bottom:10px;border-radius:18px;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s;text-align:center;}
.menu-item:hover{background:#222;}
main{margin-top:100px;padding:16px;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
input,button{padding:14px;border-radius:20px;border:none;font-size:1rem;outline:none;}
input{background:#222;color:white;}
input::placeholder{color:#aaa;}
button{background:#000;color:white;font-weight:600;cursor:pointer;transition:.3s;}
button:hover{background:#222;}
.card{background:var(--panel);border-radius:20px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.info{font-size:.9rem;flex:1 1 180px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.status-btn,.delete-btn{border-radius:18px;padding:10px 16px;font-weight:600;border:1px solid #333;background:#000;cursor:pointer;flex:1 1 100px;text-align:center;transition:.3s;}
.status-btn.pago{color:var(--green);}
.status-btn.nao{color:var(--red);}
.status-btn:hover,.delete-btn:hover{background:#111;}
.totals{text-align:center;font-weight:600;margin-top:15px;background:#1a1a1a;border-radius:20px;padding:14px;}
.month-group{margin-top:20px;}
.month-title{font-weight:700;font-size:1.1rem;margin-bottom:8px;text-align:left;}
.loading{opacity:.6;pointer-events:none;}
@media(max-width:480px){.form{grid-template-columns:1fr;}.actions{flex-direction:column;}}
</style>
</head>
<body>
<header>Painel de Vendas</header>

<div id="topButtons">
  <button class="top-btn" id="hamburgerBtn">&#9776;</button>
  <button class="top-btn" onclick="carregarVendas()">⟳</button>
</div>

<aside id="sidebar">
  <div class="menu-item" onclick="filtrar('todas')">Todas</div>
  <div class="menu-item" onclick="filtrar('pago')">Pagas</div>
  <div class="menu-item" onclick="filtrar('nao')">Não Pagas</div>
  <div id="mesesMenu"></div>
</aside>

<main>
  <section class="form">
    <input id="cliente" placeholder="Nome do cliente">
    <input id="valor" type="number" step="0.01" placeholder="Valor (R$)">
    <input id="quantidade" type="number" min="1" value="1" placeholder="Qtd">
    <input id="dataVenda" type="date">
    <button onclick="adicionarVenda()">Adicionar</button>
  </section>

  <div id="listaVendas"></div>
  <div class="totals" id="totais">Total Pago: R$ 0,00 | Total Não Pago: R$ 0,00</div>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwgIvldXl7KVcRI4QVP4wdcsijRDRv2Ffv-gSLBpTw3H1CzMgjTqdjal2eoD_wWLelEpw/exec";
const sidebar=document.getElementById('sidebar');
const hamburgerBtn=document.getElementById('hamburgerBtn');
const dataVenda=document.getElementById('dataVenda');
let cacheVendas=[];

hamburgerBtn.addEventListener('click',e=>{e.stopPropagation();sidebar.classList.toggle('open');});
document.addEventListener('click',e=>{if(!sidebar.contains(e.target)&&!hamburgerBtn.contains(e.target))sidebar.classList.remove('open');});
dataVenda.value=new Date().toISOString().split('T')[0];

async function fetchAPI(params={}){try{const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(params)});return await res.json();}catch{return[];}}

async function carregarVendas(){
  document.body.classList.add('loading');
  const vendas=await fetchAPI();
  cacheVendas=Array.isArray(vendas)?vendas.sort((a,b)=>a.cliente.localeCompare(b.cliente)):[];
  atualizarMenuMeses();
  exibirVendas(cacheVendas);
  document.body.classList.remove('loading');
}

function atualizarMenuMeses(){
  const mesesMenu=document.getElementById("mesesMenu");
  mesesMenu.innerHTML="";
  const meses={};
  cacheVendas.forEach(v=>{
    const dateObj=new Date(v.dataVenda);
    const monthName=dateObj.toLocaleString('pt-BR',{month:'long',year:'numeric'});
    meses[monthName]=true;
  });
  Object.keys(meses).sort((a,b)=>new Date(a)-new Date(b)).forEach(mes=>{
    const div=document.createElement("div");
    div.className="menu-item";
    div.textContent=mes;
    div.onclick=()=>filtrarMes(mes);
    mesesMenu.appendChild(div);
  });
}

function exibirVendas(vendas){
  const lista=document.getElementById('listaVendas');
  lista.innerHTML="";
  let totalPago=0,totalNao=0;
  const vendasPorMes={};
  vendas.forEach(v=>{
    const dateObj=new Date(v.dataVenda);
    const monthName=dateObj.toLocaleString('pt-BR',{month:'long',year:'numeric'});
    if(!vendasPorMes[monthName]) vendasPorMes[monthName]=[];
    vendasPorMes[monthName].push(v);
  });

  Object.keys(vendasPorMes).forEach(mes=>{
    const monthDiv=document.createElement("div");
    monthDiv.className="month-group";
    const title=document.createElement("div");
    title.className="month-title";
    title.textContent=mes;
    monthDiv.appendChild(title);

    vendasPorMes[mes].forEach(v=>{
      const card=document.createElement("div");
      card.className="card";
      card.dataset.id=v.id;

      const info=document.createElement("div");
      info.className="info";
      info.innerHTML=`<strong>${v.cliente}</strong><br>Valor: R$ ${v.valor.toFixed(2)}<br>Qtd: ${v.quantidade} | Total: R$ ${(v.valor*v.quantidade).toFixed(2)}<br>Data: ${v.dataVenda}`;

      const actions=document.createElement("div");
      actions.className="actions";

      const statusBtn=document.createElement("button");
      statusBtn.className="status-btn "+(v.pago?"pago":"nao");
      statusBtn.textContent=v.pago?"PAGO":"NÃO PAGO";
      statusBtn.onclick=()=>updateStatusCard(v.id,statusBtn);

      const delBtn=document.createElement("button");
      delBtn.className="delete-btn";
      delBtn.textContent="EXCLUIR";
      delBtn.onclick=()=>deleteCard(v.id,card);

      actions.appendChild(statusBtn);
      actions.appendChild(delBtn);
      card.appendChild(info);
      card.appendChild(actions);
      monthDiv.appendChild(card);

      if(v.pago) totalPago+=v.valor*v.quantidade;
      else totalNao+=v.valor*v.quantidade;
    });

    lista.appendChild(monthDiv);
  });

  document.getElementById('totais').textContent=`Total Pago: R$ ${totalPago.toFixed(2)} | Total Não Pago: R$ ${totalNao.toFixed(2)}`;
}

// ATUALIZA STATUS RAPIDAMENTE
async function updateStatusCard(id,btn){
  btn.disabled=true;
  const novoStatus=btn.textContent==="NÃO PAGO";
  const res=await fetchAPI({id,pago:novoStatus});
  if(res.success){
    btn.textContent=novoStatus?"PAGO":"NÃO PAGO";
    btn.className="status-btn "+(novoStatus?"pago":"nao");
    // Atualiza totais sem recarregar
    const card=document.querySelector(`.card[data-id='${id}']`);
    const totalPagoEl=document.getElementById('totais');
    recalcTotais();
  }
  btn.disabled=false;
}

// DELETA CARD RAPIDAMENTE
async function deleteCard(id,card){
  if(!confirm("Deseja realmente excluir esta venda?")) return;
  const res=await fetchAPI({acao:"excluir",id});
  if(res.success){
    card.remove();
    cacheVendas=cacheVendas.filter(v=>v.id!==id);
    recalcTotais();
  }
}

function recalcTotais(){
  let totalPago=0,totalNao=0;
  cacheVendas.forEach(v=>{
    if(v.pago) totalPago+=v.valor*v.quantidade;
    else totalNao+=v.valor*v.quantidade;
  });
  document.getElementById('totais').textContent=`Total Pago: R$ ${totalPago.toFixed(2)} | Total Não Pago: R$ ${totalNao.toFixed(2)}`;
}

async function adicionarVenda(){
  const cliente=document.getElementById('cliente').value.trim();
  const valor=parseFloat(document.getElementById('valor').value);
  const quantidade=parseInt(document.getElementById('quantidade').value)||1;
  const data=document.getElementById('dataVenda').value;
  if(!cliente||isNaN(valor)) return alert("Preencha os campos corretamente!");
  const res=await fetchAPI({acao:"adicionar",cliente,valor,quantidade,dataVenda:data});
  if(res.success) carregarVendas();
}

function filtrar(status){
  const cards=document.querySelectorAll(".card");
  cards.forEach(card=>{
    const btn=card.querySelector(".status-btn");
    if(status==="todas") card.style.display="flex";
    else if(status==="pago") card.style.display=btn.textContent==="PAGO"?"flex":"none";
    else if(status==="nao") card.style.display=btn.textContent==="NÃO PAGO"?"flex":"none";
  });
}

function filtrarMes(mes){
  const groups=document.querySelectorAll(".month-group");
  groups.forEach(g=>{
    const title=g.querySelector(".month-title").textContent;
    g.style.display=title===mes?"block":"none";
  });
}

carregarVendas();
</script>
</body>
</html>
