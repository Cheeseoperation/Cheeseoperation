<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Vendas</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg: #0b0b0b;            /* página */
      --surface: #111111;       /* cards / sidebar */
      --card: #141414;          /* card inner */
      --text: #ffffff;          /* principal */
      --muted: #a8a8a8;         /* textos secundários */
      --accent: #2f9cff;        /* ação */
      --success: #00c77a;       /* pago */
      --danger: #ff5c6c;        /* excluir */
      --radius: 12px;
      --glass: rgba(255,255,255,0.03);
      --shadow: 0 8px 30px rgba(0,0,0,0.6);
      --duration: 220ms;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      line-height:1.28;
    }

    /* Shell layout */
    .wrap { max-width:1200px; margin:18px auto; padding:18px; display:grid; grid-template-columns:260px 1fr; gap:18px; align-items:start; }
    @media (max-width:920px){ .wrap{ grid-template-columns:1fr; padding:12px; } }

    /* SIDEBAR - SOLID */
    .sidebar {
      background: var(--surface);
      border-radius: var(--radius);
      padding:18px;
      box-shadow: var(--shadow);
      height: calc(100vh - 36px);
      position: sticky;
      top: 18px;
      display:flex;
      flex-direction:column;
      gap:14px;
      color:var(--text);
    }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:1.05rem; }
    .brand .logo {
      width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
      background:var(--text); color:var(--bg); font-weight:800;
    }
    .section-title { font-size:0.85rem; color:var(--muted); margin:8px 0 4px 0; font-weight:600; }

    .side-controls { display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
    .side-controls button {
      background:transparent; color:var(--text); border:none; padding:10px; border-radius:10px; text-align:left; cursor:pointer;
      font-weight:600; transition: all var(--duration) ease;
    }
    .side-controls button:hover { background: rgba(255,255,255,0.02); transform: translateY(-3px); }
    .side-controls button.active { background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02); }

    .months { margin-top:6px; overflow:auto; padding-right:6px; display:flex; flex-direction:column; gap:8px; }
    .months button { background:transparent; color:var(--text); border:none; padding:8px; border-radius:8px; text-align:left; cursor:pointer; }
    .months button:hover { background: rgba(255,255,255,0.02); }

    .sidebar-footer { margin-top:auto; color:var(--muted); font-size:0.9rem; }

    /* MAIN */
    main { display:flex; flex-direction:column; gap:12px; }

    /* header */
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .top-left { display:flex; gap:12px; align-items:center; }
    .title { font-size:1.25rem; font-weight:700; letter-spacing:0.2px; }
    .muted { color:var(--muted); font-size:0.92rem; }

    .controls { display:flex; gap:10px; align-items:center; }
    .hamburger { display:none; background:transparent; border:none; color:var(--text); font-size:1.05rem; padding:10px; border-radius:8px; cursor:pointer; }
    @media (max-width:920px){ .hamburger{ display:inline-flex } }

    .search {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.03);
      padding:8px 10px; border-radius:10px; display:flex; gap:8px; align-items:center; min-width:260px;
    }
    .search input { background:transparent; border:none; outline:none; color:var(--text); width:200px; font-size:0.95rem; }
    .sync-btn {
      background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--text); padding:8px 10px; border-radius:10px; cursor:pointer;
      transition:all var(--duration);
    }
    .sync-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(47,153,255,0.06); }

    /* form */
    .form {
      display:flex; gap:10px; align-items:center; padding:12px; border-radius:12px; background:var(--card); box-shadow: var(--shadow); flex-wrap:wrap;
    }
    .form input[type="text"], .form input[type="number"], .form input[type="date"] {
      background:transparent; border:1px solid rgba(255,255,255,0.03); padding:10px; border-radius:8px; color:var(--text); min-width:120px;
    }
    .form .small { width:110px; }
    .btn-primary { background:var(--accent); color:var(--text); border:none; padding:10px 12px; border-radius:10px; font-weight:700; cursor:pointer; transition:all var(--duration); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow:0 12px 36px rgba(51,153,255,0.08); }

    /* counter row */
    .top-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:4px; }
    .counter { color:var(--muted); font-weight:600; }

    /* cards grid */
    .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:8px; }
    @media (max-width:920px){ .cards { grid-template-columns:1fr } }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      transition: transform var(--duration), box-shadow var(--duration), opacity var(--duration);
    }
    .card-left { display:flex; flex-direction:column; gap:6px; max-width:68%; }
    .client { font-weight:700; font-size:1rem; color:var(--text); }
    .meta { color:var(--muted); font-size:0.9rem; }

    .card-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }

    /* icon circle minimal */
    .icon {
      width:46px; height:46px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; border:none; cursor:pointer;
      background:transparent; color:var(--muted); font-size:1.05rem; transition: transform var(--duration), box-shadow var(--duration), color var(--duration);
    }
    .icon:hover { transform:translateY(-4px); }
    .icon.paid { color:var(--success); box-shadow: 0 8px 26px rgba(0,199,136,0.06); }
    .icon.unpaid { color:var(--muted); }
    .icon.del { color:var(--danger); }
    .icon.del:hover { box-shadow: 0 10px 26px rgba(255,92,108,0.07); transform: translateY(-3px) scale(1.05); }

    /* totals footer */
    .footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-top:12px;
      background:var(--surface); box-shadow: var(--shadow);
    }
    .totals-text { font-weight:700; }
    .bar { flex:1; margin-left:14px; height:10px; background:rgba(255,255,255,0.03); border-radius:999px; overflow:hidden; }
    .bar .paid { height:100%; background:linear-gradient(90deg,var(--success), #00f0a0); display:block; }

    /* placeholder card when empty */
    .placeholder { padding:18px; border-radius:12px; text-align:center; color:var(--muted); }

    /* toast */
    .toast-wrap { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:9999; }
    .toast { background:#111; color:var(--text); padding:10px 14px; border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,0.6); opacity:0.98; }

    /* focus */
    input:focus, button:focus { outline: 2px solid rgba(47,153,255,0.12); outline-offset:2px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="wrap" role="application" aria-label="Painel de Vendas">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Filtros">
      <div class="brand"><div class="logo">PV</div> <div>Painel de Vendas</div></div>

      <div class="side-section">
        <div class="section-title">Filtros</div>
        <div class="side-controls" role="toolbar" aria-label="Filtros de status">
          <button id="btnTodas" onclick="setFiltro(null,null)">Todas</button>
          <button id="btnPagas" onclick="setFiltro('pago',null)">Pagas</button>
          <button id="btnNao" onclick="setFiltro('nao',null)">Não Pagas</button>
        </div>
      </div>

      <div class="side-section">
        <div class="section-title">Meses</div>
        <div class="months" id="mesesMenu" aria-label="Meses"></div>
      </div>

      <div class="sidebar-footer">© Sistema • Interface corporativa</div>
    </aside>

    <!-- MAIN -->
    <main>
      <div class="topbar">
        <div class="top-left">
          <button class="hamburger" id="hamburgerBtn" aria-label="Abrir filtros"><i class="fa-solid fa-bars"></i></button>
          <div style="display:flex;flex-direction:column">
            <div class="title">Painel de Vendas</div>
            <div class="muted" style="margin-top:4px">Visão geral</div>
          </div>
        </div>

        <div class="controls">
          <div class="search" role="search" aria-label="Buscar por cliente">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i>
            <input id="searchInput" placeholder="Buscar por cliente..." />
          </div>
          <button id="syncBtn" class="sync-btn" title="Sincronizar">🔄 Sincronizar</button>
        </div>
      </div>

      <!-- form -->
      <div class="form" role="form" aria-label="Adicionar venda">
        <input id="cliente" type="text" placeholder="Nome do cliente" aria-label="Nome do cliente" />
        <input id="valorUnit" type="number" placeholder="Valor unitário (R$)" min="0" step="0.01" aria-label="Valor unitário" />
        <input id="quantidade" type="number" class="small" placeholder="Qtd" min="1" value="1" aria-label="Quantidade" />
        <input id="valorTotal" type="number" placeholder="Total (R$)" min="0" step="0.01" aria-label="Valor total" />
        <input id="dataVenda" type="date" aria-label="Data da venda" />
        <button class="btn-primary" id="addBtn" aria-label="Adicionar"><i class="fa-solid fa-plus"></i>&nbsp;&nbsp;Adicionar</button>
      </div>

      <!-- counter -->
      <div class="top-meta">
        <div class="counter" id="contador">0 vendas exibidas</div>
        <div class="muted" id="filtroInfo">Filtrando: Todas</div>
      </div>

      <!-- cards -->
      <section>
        <div id="cardsContainer" class="cards" aria-live="polite"></div>
      </section>

      <!-- footer totals -->
      <div class="footer" role="contentinfo">
        <div class="totals-text" id="totaisText">Total Pago: R$ 0,00 | Total Não Pago: R$ 0,00</div>
        <div class="bar" aria-hidden="true"><div id="paidBar" class="paid" style="width:0%"></div></div>
      </div>
    </main>
  </div>

  <!-- toasts -->
  <div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script>
    /* ================= Config ================= */
    const API_URL = "https://script.google.com/macros/s/AKfycbycXqhk6YtdwZQOfbnx8OqnAwy8o9AkQYoZTXs24VZaAdaIZ-ELC77lPlHkKNOS1in3/exec";
    const nomesMes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    /* ================ Estado ================ */
    let vendas = []; // { id, cliente, valorUnit, quantidade, valorTotal, dataVenda, pago }
    let filtroMes = null;
    let filtroStatus = null;

    /* ================ Elements ================ */
    const sidebar = document.getElementById('sidebar');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const cardsContainer = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    const mesesMenu = document.getElementById('mesesMenu');
    const contadorEl = document.getElementById('contador');
    const filtroInfoEl = document.getElementById('filtroInfo');
    const totaisText = document.getElementById('totaisText');
    const paidBar = document.getElementById('paidBar');
    const toasts = document.getElementById('toasts');

    // form
    const clienteEl = document.getElementById('cliente');
    const valorUnitEl = document.getElementById('valorUnit');
    const qtdEl = document.getElementById('quantidade');
    const valorTotalEl = document.getElementById('valorTotal');
    const dataEl = document.getElementById('dataVenda');
    const addBtn = document.getElementById('addBtn');
    const syncBtn = document.getElementById('syncBtn');

    /* ================ Helpers ================ */
    const formatBRL = (v) => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
    const hojeISO = () => new Date().toISOString().split('T')[0];

    function toast(msg, short = true){
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      toasts.appendChild(t);
      setTimeout(()=> t.style.opacity = '0.0', short ? 1800 : 3600);
      setTimeout(()=> t.remove(), short ? 2200 : 4000);
    }

    // hamburger mobile behavior
    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    document.addEventListener('click', (e) => {
      if (window.innerWidth > 920) return;
      if (!sidebar.classList.contains('open')) return;
      if (e.target.closest('.sidebar') || e.target.closest('#hamburgerBtn')) return;
      sidebar.classList.remove('open');
    });

    /* ============== Form logic (unit/qty/total) ============== */
    let ultimaUnit = null;
    valorUnitEl.addEventListener('input', () => {
      const u = parseFloat(valorUnitEl.value);
      if (!isNaN(u) && u >= 0) ultimaUnit = u;
      recalcularTotalAuto();
    });
    qtdEl.addEventListener('input', () => recalcularTotalAuto());
    valorTotalEl.addEventListener('input', () => { /* editable by user - allowed */ });

    function recalcularTotalAuto(){
      const unit = parseFloat(valorUnitEl.value);
      const q = parseInt(qtdEl.value) || 1;
      // se usuário digitou unit, usamos ele; senão, se ultimaUnit detectada use ela; caso contrário não forçamos
      const base = (!isNaN(unit) && unit >= 0) ? unit : (ultimaUnit || 0);
      if (base !== null) {
        const total = base * q;
        valorTotalEl.value = total ? total.toFixed(2) : '';
      }
    }

    /* ============== Fetch util (timeout) ============== */
    async function fetchWithTimeout(url, opts = {}, timeout = 12000){
      const controller = new AbortController();
      const id = setTimeout(()=> controller.abort(), timeout);
      try {
        const res = await fetch(url, {...opts, signal: controller.signal});
        clearTimeout(id);
        return res;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    /* ============== Load / Sync ============== */
    async function carregarVendas(){
      syncBtn.disabled = true;
      syncBtn.textContent = '🔄 Sincronizando...';
      try {
        const res = await fetchWithTimeout(API_URL + '?acao=listar', { cache:'no-store' }, 12000);
        const data = await res.json();
        vendas = (Array.isArray(data) ? data : []).map(r => {
          const valorTotal = Number(r.valor || r.Valor || r.total || r.value || 0);
          const quantidade = Number(r.quantidade || r.qtd || r.qty || 1) || 1;
          const valorUnit = quantidade > 0 ? (valorTotal / quantidade) : valorTotal;
          return {
            id: String(r.id || r.ID || r.Id || r.rowId || (Date.now() + Math.random())),
            cliente: (r.cliente || r.Cliente || r.nome || r.name || '').toString(),
            valorUnit: Number(valorUnit || 0),
            quantidade: Number(quantidade || 1),
            valorTotal: Number(valorTotal || (valorUnit * quantidade)),
            dataVenda: (r.dataVenda || r.DataVenda || r.date || r.data || hojeISO()),
            pago: (r.pago === true || r.pago === 'true' || r.pago === '1' || r.pago === 1)
          };
        });
        ordenarVendas();
        gerarBotoesMeses();
        atualizarLista();
        toast('Sincronização concluída', true);
      } catch (err){
        console.error('carregarVendas', err);
        toast('Erro ao sincronizar. Verifique conexão.', false);
      } finally {
        syncBtn.disabled = false;
        syncBtn.textContent = '🔄 Sincronizar';
      }
    }
    syncBtn.addEventListener('click', carregarVendas);

    /* ============== ordenar / gerar meses / filtros ============== */
    function ordenarVendas(){ vendas.sort((a,b)=> (a.cliente||'').localeCompare((b.cliente||''), 'pt-BR', {sensitivity:'base'})); }

    function gerarBotoesMeses(){
      mesesMenu.innerHTML = '';
      const btnAll = document.createElement('button');
      btnAll.textContent = 'Todos os Meses';
      if (filtroMes === null) btnAll.classList.add('active');
      btnAll.onclick = () => setFiltro(null,null);
      mesesMenu.appendChild(btnAll);

      const setMes = new Set();
      vendas.forEach(v => {
        if (!v.dataVenda) return;
        const d = new Date(v.dataVenda);
        if (isNaN(d)) return;
        const ano = d.getFullYear();
        const mes = String(d.getMonth()+1).padStart(2,'0');
        setMes.add(`${ano}-${mes}`);
      });
      Array.from(setMes).sort((a,b)=> b.localeCompare(a)).forEach(mstr => {
        const [y,m] = mstr.split('-');
        const b = document.createElement('button');
        b.textContent = `${nomesMes[Number(m)-1]} ${y}`;
        if (filtroMes === mstr) b.classList.add('active');
        b.onclick = () => setFiltro(filtroStatus, mstr);
        mesesMenu.appendChild(b);
      });
    }

    function setFiltro(status, mes){
      filtroStatus = status;
      filtroMes = mes;
      document.querySelectorAll('.side-controls button').forEach(btn => btn.classList.remove('active'));
      if (status === null) document.getElementById('btnTodas').classList.add('active');
      else if (status === 'pago') document.getElementById('btnPagas').classList.add('active');
      else if (status === 'nao') document.getElementById('btnNao').classList.add('active');
      gerarBotoesMeses();
      atualizarLista();
    }

    /* ============== Add venda ============== */
    addBtn.addEventListener('click', async () => {
      const cliente = (clienteEl.value || '').trim();
      const unit = Number(valorUnitEl.value) || 0;
      const quantidade = Number(qtdEl.value) || 1;
      const total = Number(valorTotalEl.value) || (unit * quantidade);
      const dataVenda = dataEl.value || hojeISO();

      if (!cliente || isNaN(total) || total <= 0 || !dataVenda) {
        toast('Preencha cliente, total e data corretamente.', false);
        return;
      }

      const payload = { acao:'adicionar', cliente, valor: total, quantidade, dataVenda, pago:false };

      try {
        addBtn.disabled = true;
        const res = await fetchWithTimeout(API_URL, {
          method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
        }, 12000);
        const json = await res.json();
        const newId = String(json.id || json.ID || json.newId || json.rowId || (Date.now()+Math.random()));

        const item = {
          id: newId,
          cliente,
          valorUnit: unit || (total / quantidade),
          quantidade,
          valorTotal: Number(total),
          dataVenda,
          pago: false
        };
        vendas.push(item);
        ordenarVendas();
        gerarBotoesMeses();
        atualizarLista();
        // limpar form
        clienteEl.value = '';
        valorUnitEl.value = '';
        qtdEl.value = '1';
        valorTotalEl.value = '';
        dataEl.value = hojeISO();
        ultimaUnit = null;
        toast('Venda adicionada', true);
      } catch (err){
        console.error('adicionar', err);
        toast('Erro ao adicionar venda', false);
      } finally { addBtn.disabled = false; }
    });

    /* ============== Toggle pago ============== */
    async function togglePago(id, btnEl){
      const idx = vendas.findIndex(x=> x.id === id);
      if (idx === -1) return;
      const item = vendas[idx];
      const prev = item.pago;
      item.pago = !item.pago;

      // small animation
      const card = btnEl.closest('.card');
      if (card) card.animate([{transform:'scale(1)'},{transform:'scale(.98)'},{transform:'scale(1)'}], {duration:200, easing:'ease-out'});

      atualizarLista();
      try {
        const payload = { acao:'atualizar', id: item.id, pago: item.pago };
        await fetchWithTimeout(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) }, 10000);
        toast('Status atualizado', true);
      } catch (err){
        console.error('togglePago', err);
        item.pago = prev;
        atualizarLista();
        toast('Erro ao atualizar status', false);
      }
    }

    /* ============== Excluir ============== */
    async function excluirVenda(id, btnEl){
      if (!confirm('Confirmar exclusão?')) return;
      const idx = vendas.findIndex(x=> x.id === id);
      if (idx === -1) return;
      const card = btnEl.closest('.card');
      if (card) card.classList.add('fade-out');
      setTimeout(()=> {
        vendas.splice(idx,1);
        gerarBotoesMeses();
        atualizarLista();
        toast('Venda excluída', true);
      }, 200);
      try {
        const payload = { acao:'excluir', id };
        await fetchWithTimeout(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) }, 10000);
      } catch (err){
        console.error('excluir', err);
        toast('Erro ao excluir no servidor', false);
      }
    }

    /* ============== Atualizar / Render ============== */
    function atualizarLista(){
      cardsContainer.innerHTML = '';
      const q = (searchInput.value || '').trim().toLowerCase();

      let filtradas = vendas.filter(v => {
        if (q && !(v.cliente || '').toLowerCase().includes(q)) return false;
        if (filtroStatus === 'pago' && !v.pago) return false;
        if (filtroStatus === 'nao' && v.pago) return false;
        if (filtroMes){
          const d = new Date(v.dataVenda);
          const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          if (key !== filtroMes) return false;
        }
        return true;
      });

      // ordenar alfabeticamente
      filtradas.sort((a,b) => (a.cliente||'').localeCompare(b.cliente||'', 'pt-BR', {sensitivity:'base'}));

      let totalPago = 0, totalNao = 0;
      if (filtradas.length === 0){
        const p = document.createElement('div'); p.className = 'placeholder'; p.textContent = 'Nenhuma venda encontrada.'; cardsContainer.appendChild(p);
      } else {
        filtradas.forEach(v => {
          const card = document.createElement('article'); card.className = 'card';
          const left = document.createElement('div'); left.className = 'card-left';
          const clientEl = document.createElement('div'); clientEl.className = 'client'; clientEl.textContent = v.cliente || '(sem nome)';
          const metaEl = document.createElement('div'); metaEl.className = 'meta';
          metaEl.innerHTML = `${v.quantidade}x • ${new Date(v.dataVenda).toLocaleDateString('pt-BR')} • <span style="color:var(--muted)">${formatBRL(v.valorTotal)}</span>`;
          left.appendChild(clientEl); left.appendChild(metaEl);

          const right = document.createElement('div'); right.className = 'card-right';

          const paidBtn = document.createElement('button');
          paidBtn.className = 'icon' + (v.pago ? ' paid' : ' unpaid');
          paidBtn.setAttribute('aria-label', v.pago ? 'Marcar como não pago' : 'Marcar como pago');
          paidBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i>';
          paidBtn.onclick = (ev) => togglePago(v.id, ev.currentTarget);

          const delBtn = document.createElement('button');
          delBtn.className = 'icon del';
          delBtn.setAttribute('aria-label', 'Excluir venda');
          delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
          delBtn.onclick = (ev) => excluirVenda(v.id, ev.currentTarget);

          right.appendChild(paidBtn); right.appendChild(delBtn);

          card.appendChild(left); card.appendChild(right);
          cardsContainer.appendChild(card);

          if (v.pago) totalPago += Number(v.valorTotal || 0); else totalNao += Number(v.valorTotal || 0);
        });
      }

      // totals UI
      const totalGeral = totalPago + totalNao;
      const pct = totalGeral ? Math.round((totalPago/totalGeral)*100) : 0;
      totaisText.textContent = `Total Pago: ${formatBRL(totalPago)} | Total Não Pago: ${formatBRL(totalNao)}`;
      paidBar.style.width = pct + '%';

      // counter & filter info
      contadorEl.textContent = `${filtradas.length} venda${filtradas.length === 1 ? '' : 's'} exibida${filtradas.length === 1 ? '' : 's'}`;
      filtroInfoEl.textContent = filtroStatus ? (filtroStatus === 'pago' ? 'Filtrando: Pagas' : 'Filtrando: Não Pagas') : 'Filtrando: Todas';
    }

    /* ============== init ============== */
    (function init(){
      dataEl.value = hojeISO();
      searchInput.addEventListener('input', atualizarLista);
      valorUnitEl.addEventListener('input', () => { ultimaUnit = parseFloat(valorUnitEl.value) || ultimaUnit; recalcularTotalAuto(); });
      qtdEl.addEventListener('input', recalcularTotalAuto);
      valorTotalEl.addEventListener('input', ()=>{}); // editable

      // load
      carregarVendas();
    }());
  </script>
</body>
</html>
